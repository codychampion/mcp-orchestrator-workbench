name: smoke

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python services
        run: |
          python -m compileall orchestrator-service mcp-server logging-service
      - name: Install orchestrator test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r orchestrator-service/requirements.txt
      - name: Run orchestration unit tests
        run: |
          python -m unittest discover -s orchestrator-service/tests -v
